<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Overlay Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .form-section, .preview-section {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 12px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-label:hover {
            background: #e8e8e8;
            border-color: #667eea;
        }

        .file-name {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .color-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }

        .color-input-group input {
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .preview-section {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #preview {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .preview-placeholder {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        .preview-placeholder svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-btn {
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Image Overlay Generator</h1>
            <p>Create beautiful quote images with text and logo overlays</p>
        </div>

        <div class="content">
            <div class="form-section">
                <form id="overlayForm">
                    <div class="form-group">
                        <label>Background Image *</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="background" accept="image/*" required>
                            <label for="background" class="file-input-label">
                                📁 Choose Background Image
                            </label>
                            <div class="file-name" id="bgFileName"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Text *</label>
                        <textarea id="text" placeholder="Enter your quote or text here..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Text Size (px)</label>
                        <input type="number" id="textSize" value="40" min="10" max="200">
                    </div>

                    <div class="form-group">
                        <label>Text Color (R, G, B, A)</label>
                        <div class="color-input-group">
                            <input type="number" id="colorR" value="0" min="0" max="255" placeholder="R">
                            <input type="number" id="colorG" value="0" min="0" max="255" placeholder="G">
                            <input type="number" id="colorB" value="0" min="0" max="255" placeholder="B">
                            <input type="number" id="colorA" value="255" min="0" max="255" placeholder="A">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Text Position</label>
                        <select id="textPosition">
                            <option value="center">Center</option>
                            <option value="top-left">Top Left</option>
                            <option value="top-right">Top Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="bottom-right">Bottom Right</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Max Text Width (characters per line)</label>
                        <input type="number" id="maxTextWidth" value="50" min="10" max="100">
                    </div>

                    <div class="form-group">
                        <label>Logo Image (Optional)</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="logo" accept="image/*">
                            <label for="logo" class="file-input-label">
                                📁 Choose Logo Image
                            </label>
                            <div class="file-name" id="logoFileName"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Logo Position</label>
                        <select id="logoPosition">
                            <option value="bottom-right">Bottom Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="top-right">Top Right</option>
                            <option value="top-left">Top Left</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Output Format</label>
                        <select id="outputFormat">
                            <option value="PNG">PNG</option>
                            <option value="JPEG">JPEG</option>
                        </select>
                    </div>

                    <button type="submit">Generate Image</button>
                </form>
            </div>

            <div class="preview-section">
                <div class="preview-placeholder" id="placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <h3>Preview</h3>
                    <p>Your generated image will appear here</p>
                </div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Generating your image...</p>
                </div>
                <img id="preview" alt="Preview">
                <button class="download-btn" id="downloadBtn">Download Image</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/overlay';
        
        // File input handlers
        document.getElementById('background').addEventListener('change', function(e) {
            document.getElementById('bgFileName').textContent = e.target.files[0]?.name || '';
        });

        document.getElementById('logo').addEventListener('change', function(e) {
            document.getElementById('logoFileName').textContent = e.target.files[0]?.name || '';
        });

        // Form submission
        document.getElementById('overlayForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData();
            
            // Add files
            const bgFile = document.getElementById('background').files[0];
            const logoFile = document.getElementById('logo').files[0];
            
            if (!bgFile) {
                alert('Please select a background image');
                return;
            }

            formData.append('background', bgFile);
            if (logoFile) {
                formData.append('logo', logoFile);
            }

            // Add text and settings
            formData.append('text', document.getElementById('text').value);
            formData.append('text_size', document.getElementById('textSize').value);
            
            const colorR = document.getElementById('colorR').value;
            const colorG = document.getElementById('colorG').value;
            const colorB = document.getElementById('colorB').value;
            const colorA = document.getElementById('colorA').value;
            formData.append('text_color', `${colorR},${colorG},${colorB},${colorA}`);
            
            formData.append('text_position', document.getElementById('textPosition').value);
            formData.append('max_text_width', document.getElementById('maxTextWidth').value);
            formData.append('logo_position', document.getElementById('logoPosition').value);
            formData.append('output_format', document.getElementById('outputFormat').value);

            // Show loading
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to generate image');
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);

                // Show preview
                const preview = document.getElementById('preview');
                preview.src = imageUrl;
                preview.style.display = 'block';
                
                // Setup download button
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.style.display = 'block';
                downloadBtn.onclick = function() {
                    const a = document.createElement('a');
                    a.href = imageUrl;
                    a.download = `overlay.${document.getElementById('outputFormat').value.toLowerCase()}`;
                    a.click();
                };

                document.getElementById('loading').style.display = 'none';

            } catch (error) {
                alert('Error: ' + error.message + '\n\nMake sure the API is running at ' + API_URL);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('placeholder').style.display = 'block';
            }
        });
    </script>
</body>
</html>
